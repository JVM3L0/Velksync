# Limite baixo: o WSL tem ~5 GB no total e o daemon fica vivo após o build.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
# Usa os núcleos (os plugins são módulos independentes) e reaproveita saídas
# de builds anteriores; o teto de workers mantém a memória sob controle.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
