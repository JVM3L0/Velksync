<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="t d">
<title id="t">Como o Velksync funciona</title>
<desc id="d">O celular liga o PC por Wake-on-LAN, manda comandos ao agente por HTTPS com certificado fixado, recebe desempenho, mídia e avisos ao vivo e vê o PC ligado antes do login pelo sinal de presença. Tudo na rede local.</desc>
<defs>
<marker id="m-wol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#9A6700" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="m-tls" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#0969DA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="m-live" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#1A7F37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="m-pres" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8250DF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:-apple-system,"Segoe UI",Ubuntu,"Noto Sans",Helvetica,Arial,sans-serif}.h{font-size:16px;font-weight:600;fill:#1F2328}.t{font-size:14px;font-weight:600}.m{font-size:12.5px;fill:#59636E}</style></defs>
<rect x="1" y="1" width="878" height="418" rx="16" fill="none" stroke="#D1D9E0" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="24" y="30" class="m">rede local · nada sai dela</text>
<rect x="48" y="78" width="148" height="300" rx="26" fill="none" stroke="#1F2328" stroke-width="1.8"/>
<rect x="104" y="90" width="36" height="5" rx="2.5" fill="#D1D9E0"/>
<g transform="translate(92 168) scale(1.5)"><path d="M20,34 L6,12 L11,14 L11.5,9 L15.5,15 L17,10.5 L20,21 Z" fill="#0969DA" fill-opacity="0.2" stroke="#0969DA" stroke-width="1.2" stroke-linejoin="round"/><path d="M20,34 L34,12 L29,14 L28.5,9 L24.5,15 L23,10.5 L20,21 Z" fill="#0969DA" fill-opacity="0.2" stroke="#0969DA" stroke-width="1.2" stroke-linejoin="round"/></g>
<text x="122" y="262" class="h" text-anchor="middle">App</text>
<text x="122" y="282" class="m" text-anchor="middle">Android</text>
<rect x="580" y="62" width="276" height="330" rx="18" fill="none" stroke="#1F2328" stroke-width="1.8"/>
<text x="600" y="50" class="h">PC</text>
<text x="626" y="50" class="m">Windows ou Linux</text>
<rect x="598" y="88" width="240" height="60" rx="10" fill="#F6F8FA" stroke="#D1D9E0"/>
<rect x="598" y="100" width="3" height="36" rx="1.5" fill="#9A6700"/>
<text x="616" y="114" class="t" fill="#1F2328">Placa de rede</text>
<text x="616" y="133" class="m">acorda o PC desligado</text>
<rect x="598" y="172" width="240" height="112" rx="10" fill="#F6F8FA" stroke="#D1D9E0"/>
<rect x="598" y="184" width="3" height="88" rx="1.5" fill="#0969DA"/>
<text x="616" y="198" class="t" fill="#1F2328">velksync-agent</text>
<text x="616" y="217" class="m">energia, comandos, mídia e terminal</text>
<text x="616" y="236" class="m">desempenho e avisos para o celular</text>
<text x="616" y="255" class="m">roda quando você entra</text>
<rect x="598" y="308" width="240" height="60" rx="10" fill="#F6F8FA" stroke="#D1D9E0"/>
<rect x="598" y="320" width="3" height="36" rx="1.5" fill="#8250DF"/>
<text x="616" y="334" class="t" fill="#1F2328">Sinal de presença</text>
<text x="616" y="353" class="m">responde só "estou ligado"</text>
<line x1="208" y1="118" x2="586" y2="118" stroke="#9A6700" stroke-width="2" stroke-linecap="round" marker-end="url(#m-wol)"/>
<text x="228" y="108" class="t" fill="#9A6700">Wake-on-LAN<tspan class="m" dx="10">UDP 9</tspan></text>
<line x1="208" y1="204" x2="586" y2="204" stroke="#0969DA" stroke-width="2" stroke-linecap="round" marker-end="url(#m-tls)"/>
<text x="228" y="194" class="t" fill="#0969DA">Comandos<tspan class="m" dx="10">HTTPS · TLS 1.3 com pin · TCP 41100</tspan></text>
<line x1="208" y1="252" x2="586" y2="252" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 5" marker-start="url(#m-live)"/>
<text x="228" y="242" class="t" fill="#1A7F37">Ao vivo<tspan class="m" dx="10">desempenho, mídia e avisos · SSE</tspan></text>
<line x1="208" y1="338" x2="586" y2="338" stroke="#8250DF" stroke-width="2" stroke-linecap="round" marker-start="url(#m-pres)" marker-end="url(#m-pres)"/>
<text x="228" y="328" class="t" fill="#8250DF">Presença<tspan class="m" dx="10">antes do login · UDP 41101</tspan></text>
</svg>
