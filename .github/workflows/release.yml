# Gera a release a cada tag vX.Y.Z: testa, compila o agente (Linux/Windows) e o
# APK assinado, publica com checksums e atestado de proveniência (SLSA).
#
# Segurança: ações fixadas por hash de commit (não por tag, que pode ser
# movida), nenhuma permissão por padrão e cada job pede só o que usa.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Conferir versão
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag, agente e app com a mesma versão
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          want="${TAG#v}"
          agent=$(sed -n 's/^const version = "\(.*\)"$/\1/p' agent/main.go)
          app=$(sed -n 's/^version: \([^+]*\)+.*$/\1/p' app/pubspec.yaml)
          echo "tag=$want agente=$agent app=$app"
          [ "$agent" = "$want" ] && [ "$app" = "$want" ] || { echo "::error::Versões diferentes da tag"; exit 1; }

  agent:
    name: Agente (Linux e Windows)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Testes
        working-directory: agent
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          go test -count=1 ./...
      - name: Compilar e empacotar
        working-directory: agent
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p ../out/linux ../out/windows
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../out/linux/velksync-agent .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../out/windows/velksync-agent.exe .
          cp deploy/install-linux.sh deploy/velksync-agent.service deploy/velksync-presence.service ../out/linux/
          cp deploy/install-windows.ps1 ../out/windows/
          cd ../out
          tar -czf "velksync-agent-${VERSION}-linux-amd64.tar.gz" -C linux .
          (cd windows && zip -q "../velksync-agent-${VERSION}-windows-amd64.zip" ./*)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent
          path: |
            out/*.tar.gz
            out/*.zip
          if-no-files-found: error

  app:
    name: App Android
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - name: Análise e testes
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          # Sem a chave, falha: nunca publicar um APK assinado com chave de debug.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure os Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD"
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - name: Compilar APK
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          # Um APK por processador (~25 MB cada em vez de ~72 MB). Só os
          # separados: o código de versão de cada um é diferente do APK único,
          # e misturar os dois faria o Android recusar a atualização.
          flutter build apk --release --split-per-abi
          mkdir -p ../out
          for pair in arm64-v8a:arm64 armeabi-v7a:armv7 x86_64:x86_64; do
            cp "build/app/outputs/flutter-apk/app-${pair%%:*}-release.apk" "../out/velksync-${VERSION}-${pair##*:}.apk"
          done
      - name: Apagar a chave do runner
        if: always()
        run: rm -f android/release.jks android/key.properties
      - name: Testes do widget (JVM)
        run: cd android && ./gradlew --no-daemon :app:testDebugUnitTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [agent, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a release
      id-token: write # atestado de proveniência
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      # Atestados exigem repositório público (ou GitHub Enterprise).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
