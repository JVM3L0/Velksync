# Atualizações semanais, um pedido agrupado por ecossistema. Cada pedido passa
# pelo CI (ci.yml) antes de ser aceito; nada é aplicado sozinho.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /agent
    schedule: { interval: weekly, day: monday }
    groups: { go: { patterns: ["*"] } }
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: pub
    directory: /app
    schedule: { interval: weekly, day: monday }
    groups: { flutter: { patterns: ["*"] } }
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: gradle
    directory: /app/android
    schedule: { interval: weekly, day: monday }
    groups: { gradle: { patterns: ["*"] } }
    commit-message: { prefix: "chore(deps)" }

  # Atualiza também os hashes fixados das ações e o comentário de versão.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups: { actions: { patterns: ["*"] } }
    commit-message: { prefix: "ci(deps)" }
